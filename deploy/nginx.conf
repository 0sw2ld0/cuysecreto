# Nginx para cuysecreto.cuycoders.dev (estáticos en /var/www/cuysecreto)
# Certificado: sudo certbot --nginx -d cuysecreto.cuycoders.dev
server {
    listen 80;
    server_name cuysecreto.cuycoders.dev;
    root /var/www/cuysecreto;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;   # los enlaces llevan tokens en el #, no salen igual, pero mejor no filtrar
    add_header X-Frame-Options DENY always;

    location = /config.js { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|svg|webmanifest)$ { add_header Cache-Control "public, max-age=300"; }
    location / { try_files $uri $uri/ /index.html; }
}
